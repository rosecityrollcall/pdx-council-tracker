name: Update vote data and deploy

on:
  schedule:
    # Thursdays 6pm Pacific (council meets Wed/Thu) — 01:00 UTC Friday
    - cron: "0 1 * * FRI"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape latest council data
        if: github.event_name != 'push'
        run: python scraper/scrape.py --since 2025-01-01

      - name: Bundle site data
        run: python scraper/build_site_data.py

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "roll-call-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/js/data.js
          git diff --cached --quiet || git commit -m "Data update: $(date -u +%F)"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
