<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose City Roll Call — Portland City Council vote tracker</title>
<meta name="description" content="Every Portland City Council vote, linked to the public record: who voted how, what was said on the dais, and how the record compares to the messaging.">
<link rel="stylesheet" href="css/style.css">
<script>
  // apply saved theme before first paint
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="#/">Rose City Roll Call</a>
    <nav class="main" id="nav">
      <a href="#/" data-r="home">Home</a>
      <a href="#/votes" data-r="votes">Votes</a>
      <a href="#/councilors" data-r="councilors">Councilors</a>
      <a href="#/alignment" data-r="alignment">Alignment</a>
      <a href="#/storylines" data-r="storylines">Storylines</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle color theme">◐ theme</button>
  </div>
</header>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<footer class="site">
  <div class="wrap">
    <span>Data scraped from the <a href="https://www.portland.gov/council/agenda">Portland City Council agenda</a> — every vote links to the official record.</span>
    <span id="data-stamp"></span>
  </div>
</footer>
<div id="tip" role="tooltip"></div>
<script src="js/data.js?v=20260809153628"></script>
<script src="js/app.js?v=20260809153628"></script>
</body>
</html>
